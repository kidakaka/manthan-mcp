name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure npm 11+ for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Check npm version
        id: version_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Package: $PKG_NAME"
          echo "Local version: $PKG_VERSION"
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT

          # Query npm registry to check if this version exists
          PUBLISHED_VERSION=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)

          # If triggered by a git tag or manual dispatch, always publish
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Triggered by tag or manual dispatch. Forcing publish check."
            if [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
              echo "Error: Version $PKG_VERSION is already published on npm."
              exit 1
            fi
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
            echo "Version $PKG_VERSION is already published on npm. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "New version $PKG_VERSION detected! Ready to publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run automated test suite
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm test

      - name: Build TypeScript
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish to npm (via OIDC Trusted Publisher)
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Create GitHub Release and Tag
        if: steps.version_check.outputs.should_publish == 'true' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG="v$VERSION"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating GitHub Release and tag $TAG..."
            gh release create "$TAG" --title "v$VERSION" --generate-notes
          else
            echo "Tag $TAG already exists on GitHub."
          fi
